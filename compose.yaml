# Komodo stack: frigate-gif-sidecar
#
# Listens on MQTT (frigate/events), pulls the clip.mp4 for matching doorbell-person
# events, transcodes to a low-fps palette-optimized GIF, writes it where HA can
# serve it at /local/frigate_gifs/<id>.gif, and publishes frigate-gifs/ready/<id>.
#
# HA runs in HA-OS on 192.168.10.103, NOT as a docker container — so we write
# into HA's /config/www over the HA Samba addon's `config` share. The share is
# mounted on the HOST by autofs (/etc/auto.smb.shares → /mnt/hass) and
# bind-mounted in. HA serves the files at /local/frigate_gifs/.
#
# Do NOT go back to a Docker cifs volume: a volume mount is a container-START
# precondition, and when HA's SMB isn't up yet (every HA reboot / pve power
# event) start fails with exit 128 *before* `restart: always` applies — nothing
# ever retries. That killed doorbell GIFs 2026-06-24 (6d), 2026-08-08 (13d) and
# 2026-08-25 (2 months). With the host autofs mount the container always
# starts; main.py waits for the share, and `rslave` propagation lets the
# container see the share again after autofs/cifs reconnects.
services:
  frigate-gif-sidecar:
    container_name: frigate-gif-sidecar
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    # `always`, not `unless-stopped`: if the host/daemon goes down while this
    # container is in a stopped state (e.g. it crashed first), `unless-stopped`
    # would NOT bring it back on daemon restart. `always` does. This bit us on
    # 2026-06-24 when home-debian got caught in the UnRAID power incident — the
    # sidecar exited and sat dead for ~6 days (RestartCount stayed 0).
    restart: always
    env_file:
      - .env
    environment:
      # main.py writes to $OUTPUT_DIR; we mount the HA `config` share at /ha_config
      # and target the www/frigate_gifs subdir. main.py mkdirs it if needed.
      OUTPUT_DIR: /ha_config/www/frigate_gifs
    volumes:
      - type: bind
        source: /mnt/hass
        target: /ha_config
        bind:
          propagation: rslave
    # Liveness only: the heartbeat thread touches /tmp/alive every 60s. Don't
    # probe MQTT/HA here — those are down during every HA reboot and an
    # autoheal restart can't fix them. HA alerts on missing heartbeats instead.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/alive') < 180 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

